services:
  guitar-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guitar-chord-app
    restart: always
    ports:
      - "127.0.0.1:3000:80"   # 로컬 호스트 테스트용 포트
    networks:
      - caddy
    labels:
      # 공유 Caddy ingress (~/project1/infra/caddy)가 이 라벨을 감지하여
      # 도메인 HTTPS 인증서 자동 발급 및 80번 포트로 리버스 프록시합니다.
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"

networks:
  caddy:
    external: true
